# Uncomment to enable encoder
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y

CONFIG_ZMK_SPLIT=y

# if nice!view is only installed to the main side 
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
# CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# zmk-nice-oled settings
CONFIG_NICE_EPAPER_ON=y
CONFIG_NICE_OLED_ON=n

# Central (left) side widgets
# Battery and Bluetooth profiles are shown by default as part of ZMK status screen
CONFIG_NICE_OLED_WIDGET_WPM=y
CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
CONFIG_NICE_OLED_WIDGET_RESPONSIVE=n

# Peripheral (right) side widgets - HID indicators and Bluetooth status
CONFIG_ZMK_HID_INDICATORS=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SMART_BATTERY=y
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=n
CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=n
CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=n


# Optional nice-view-gem settings (uncomment to customize)
# CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE=y
# CONFIG_NICE_VIEW_GEM_WPM_FIXED_RANGE_MAX=100
# CONFIG_NICE_VIEW_GEM_ANIMATION=y
# CONFIG_NICE_VIEW_GEM_ANIMATION_FEAME=10
# CONFIG_NICE_VIEW_GEM_ANIMATION_MS=960
